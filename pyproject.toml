[project]
name = "django-ninja-vs-drf"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-rxXs"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
